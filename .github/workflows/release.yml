name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Generate eBPF bindings
        run: go generate ./...
      - name: Build release binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X github.com/alalfymansour/vinet/cmd.Version=${VERSION}" -o dist/vinet-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X github.com/alalfymansour/vinet/cmd.Version=${VERSION}" -o dist/vinet-linux-arm64 .
          sha256sum dist/vinet-linux-* > dist/SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
