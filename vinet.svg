<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ViNet icon</title>
  <desc>Terminal prompt beside compact upload and download arrows</desc>

  <!-- Gruvbox Dark Hard palette: bg #1d2021, surface #282828,
       foreground #ebdbb2, orange #fe8019, yellow #fabd2f, aqua #8ec07c. -->
  <rect x="16" y="16" width="648" height="648" rx="28" fill="#1d2021"/>
  <rect x="17.5" y="17.5" width="645" height="645" rx="26.5" fill="none" stroke="#3c3836" stroke-width="3"/>

  <g transform="translate(-170 -170) scale(1.5)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <!-- shell prompt -->
    <polyline points="365,270 405,340 365,410" stroke="#fabd2f"/>

    <!-- compact upload arrow -->
    <line x1="310" y1="325" x2="310" y2="275" stroke="#fe8019"/>
    <polyline points="290,295 310,275 330,295" stroke="#fe8019"/>

    <!-- compact download arrow -->
    <line x1="310" y1="355" x2="310" y2="405" stroke="#8ec07c"/>
    <polyline points="290,385 310,405 330,385" stroke="#8ec07c"/>
  </g>
</svg>
